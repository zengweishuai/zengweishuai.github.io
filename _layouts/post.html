<!DOCTYPE html>
<html lang="en">
  {% include head.html %}
  <body class="page-post">
    <nav class="nav is-solid" aria-label="Main">
      <div class="nav__inner">
        <div class="nav__links">
          <a class="nav__link" href="{{ '/' | prepend: site.baseurl }}">Home</a>
          <a class="nav__link" href="{{ '/#blog' | prepend: site.baseurl }}">Blog</a>
        </div>
      </div>
    </nav>
    <main class="section">
      <article class="container post">
        <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
        <h1 class="section__title">{{ page.title }}</h1>
        <div class="post__body">{{ content }}</div>
      </article>
    </main>
    {% include footer.html %}
  </body>
</html>
