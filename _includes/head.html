<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    document.documentElement.className += " js";
    /* safety net: never leave the opening stuck if the image or script is slow */
    setTimeout(function () { var b = document.body; if (b) { b.classList.remove("is-loading"); b.classList.add("is-ready"); } }, 2000);
  </script>

  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">

  <!-- Fonts: Raleway is self-hosted so nothing blocks the first paint -->
  <link rel="preload" href="{{ '/assets/fonts/raleway-latin.woff2' | prepend: site.baseurl }}" as="font" type="font/woff2" crossorigin>

  <!-- Icons -->
  <link rel="preload" href="{{ '/assets/fonts/fontawesome-webfont.woff2' | prepend: site.baseurl }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/font-awesome.min.css' | prepend: site.baseurl }}">

  <!-- Hero painting: preload; a tiny inline placeholder shows until it arrives -->
  <link rel="preload" as="image"
        href="{{ '/assets/img/babel-1920.jpg' | prepend: site.baseurl }}"
        imagesrcset="{{ '/assets/img/babel-1280.jpg' | prepend: site.baseurl }} 1280w, {{ '/assets/img/babel-1920.jpg' | prepend: site.baseurl }} 1920w, {{ '/assets/img/babel-2560.jpg' | prepend: site.baseurl }} 2560w"
        imagesizes="100vw">

  <link rel="stylesheet" href="{{ '/assets/css/home.css' | prepend: site.baseurl }}?v={{ site.time | date: '%s' }}">
</head>
